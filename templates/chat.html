<!DOCTYPE html>
<html>
<head>
    <title>聊天</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>聊天界面</h1>
    <p>欢迎 {{ username }}!</p>
    <form action="/chat" method="POST">
        <label for="user_input">输入：</label>
        <input type="text" id="user_input" name="user_input" required><br><br>
        <button type="submit">发送</button>
    </form>

    <div id="response">
        {% if response %}
            <h2>回复:</h2>
            <p>{{ response }}</p>
        {% endif %}
    </div>

    <a href="/dashboard">返回仪表盘</a>
    <a href="/logout">登出</a>
</body>
</html>
